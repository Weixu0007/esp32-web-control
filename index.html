<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 异地远程控制</title>
    <!-- 使用全球最稳定的 Cloudflare CDN (cdnjs) 加载 Paho MQTT 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; width: 300px; border: 1px solid #334155; }
        h2 { margin-top: 0; font-size: 1.4rem; color: #38bdf8; }
        .status { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 1.5rem; background: #475569; color: #cbd5e1; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 1.2rem; }
        button { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
        .btn-on { background-color: #10b981; }
        .btn-on:hover { background-color: #059669; }
        .btn-off { background-color: #ef4444; }
        .btn-off:hover { background-color: #dc2626; }
        .log-box { background: #0f172a; padding: 10px; font-family: monospace; font-size: 0.75rem; text-align: left; height: 90px; overflow-y: auto; color: #94a3b8; border-radius: 6px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 异地远程控制</h2>
        <div id="status" class="status">正在连接云端...</div>
        
        <div class="btn-group">
            <button class="btn-on" onclick="sendCmd('ON')">开启</button>
            <button class="btn-off" onclick="sendCmd('OFF')">关闭</button>
        </div>

        <div class="log-box" id="logs">> 初始化...<br></div>
    </div>

    <script>
        const statusEl = document.getElementById("status");
        const logsEl = document.getElementById("logs");

        function log(msg) {
            logsEl.innerHTML += `> ${msg}<br>`;
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        // 检查库是否加载成功
        if (typeof Paho === "undefined") {
            log("错误: MQTT 脚本未成功加载，请检查网络！");
        } else {
            // 使用 EMQX 全球公共节点（端口 8084，WSS 加密通道，路径 /mqtt）
            const clientId = "Web_Global_" + Math.random().toString(16).substring(2, 8);
            const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", clientId);
            const topicControl = "myhouse/esp32/control";

            client.onConnectionLost = function (responseObject) {
                statusEl.innerText = "连接断开";
                statusEl.style.background = "#991b1b";
                log("连接丢失: " + responseObject.errorMessage);
            };

            client.connect({
                useSSL: true, // 加密传输
                timeout: 10,
                onSuccess: function () {
                    statusEl.innerText = "已连通云端服务器";
                    statusEl.style.background = "#065f46";
                    statusEl.style.color = "#34d399";
                    log("成功连接至 EMQX 海外节点");
                },
                onFailure: function (err) {
                    statusEl.innerText = "连接失败";
                    statusEl.style.background = "#991b1b";
                    log("失败原因: " + err.errorMessage);
                }
            });

            window.sendCmd = function(cmd) {
                if (client.isConnected()) {
                    const message = new Paho.MQTT.Message(cmd);
                    message.destinationName = topicControl;
                    client.send(message);
                    log("发送指令 -> " + cmd);
                } else {
                    alert("云端未连接！");
                }
            };
        }
    </script>
</body>
</html>
